<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>QuizOn - Acces Profesor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #c3d5f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .wrapper { display: flex; gap: 20px; }
        
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            width: 320px; 
            text-align: center; 
            border-top: 6px solid #4f46e5; 
            box-shadow: 0 10px 25px rgba(89, 116, 165, 0.4); 
            position: relative;
        }
        
        h2 { color: #4f46e5; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .btn { 
            width: 100%; padding: 12px; background: #4f46e5; color: white; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn:hover { background: #3730a3; }
        .btn-reg { background: #6366f1; margin-top: 5px; }

        .back { display: inline-block; margin-top: 15px; text-decoration: none; color: #64748b; font-size: 14px; }
        .back:hover { color: #4f46e5; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h2>Login Profesor</h2>
        <input type="text" id="lU" placeholder="Utilizator">
        <input type="password" id="lP" placeholder="Parolă">
        <button class="btn" onclick="auth('login', 'lU', 'lP')">Intră în cont</button>
        <a href="index.html" class="back">← Înapoi</a>
    </div>

    <div class="card">
        <h2>Cont Nou Prof</h2>
        <input type="text" id="rU" placeholder="Utilizator dorit">
        <input type="password" id="rP" placeholder="Parolă dorită">
        <button class="btn btn-reg" onclick="auth('register', 'rU', 'rP')">Creează Cont</button>
    </div>
</div>

<script>
async function auth(action, uId, pId) {
    const user = document.getElementById(uId).value.trim();
    const pass = document.getElementById(pId).value.trim();

    if(!user || !pass) return alert("Completează câmpurile!");

    const res = await fetch('tests.php', { 
        method: 'POST', 
        body: JSON.stringify({ action, user, pass, role: 'profesor' }) 
    });
    
    const data = await res.json();
    if(data.success) {
        if(action === 'register') {
            alert("Cont creat! Te poți loga.");
            document.getElementById(uId).value = ''; document.getElementById(pId).value = '';
        } else {
            window.location.href = 'teacher_dashboard.html';
        }
    } else { alert("⚠️ " + data.error); }
}
</script>
</body>
</html>
